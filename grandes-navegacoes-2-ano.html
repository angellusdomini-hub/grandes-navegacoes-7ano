<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grandes Navegações — 2º Ano</title>
<style>
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#d4b986;color:#2d1f13}
.loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
.box{background:#fff8e8;border:2px solid #987044;border-radius:16px;padding:24px;box-shadow:0 10px 28px rgba(54,34,12,.22)}
.box b{font-size:1.3rem}
</style>
</head>
<body>
<div class="loading"><div class="box"><b>⛵ Carregando o jogo...</b><br><small>Aguarde alguns segundos.</small></div></div>
<script>
(async()=>{
  let source="";
  const total=19;
  for(let i=1;i<=total;i++){
    const p=String(i).padStart(3,"0");
    const res=await fetch("expansao-individual-parts/part-"+p+".txt",{cache:"no-store"});
    if(!res.ok) throw new Error("Falha ao carregar parte "+p);
    source+=await res.text();
  }
  document.open();
  document.write(source);
  document.close();
})().catch(err=>{
  document.body.innerHTML='<div class="loading"><div class="box"><b>Não foi possível carregar o jogo.</b><br><small>'+err.message+'</small></div></div>';
});
</script>
</body>
</html>
